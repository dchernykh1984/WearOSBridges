# Gradle version catalog: single source of truth for dependency and plugin
# versions. Referenced from the build scripts as `libs.<alias>`.

[versions]
agp = "8.13.2"
kotlin = "2.2.21"
junit = "4.13.2"
ktlint-gradle = "14.2.0"
detekt = "1.23.8"
kover = "0.9.9"
androidxTestJunit = "1.3.0"
androidxTestRunner = "1.7.0"
# Wear Compose 1.6.2 declares androidx.compose 1.9.0, so the compose pin follows
# it rather than the other way round. No BOM: with a single Android module on a
# wear-specific train, explicit versions are easier to reason about.
wearCompose = "1.6.2"
composeUi = "1.9.0"
activityCompose = "1.12.3"
# 1.19.0 requires compileSdk 37; 1.18.0 is the highest that builds against 36.
coreKtx = "1.19.0"
wearToolingPreview = "1.0.0"
lifecycle = "2.9.4"
kotlinxCoroutines = "1.11.0"
datastore = "1.1.7"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit", version.ref = "kotlin" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
# Virtual time for the tick loop: a test plays a whole game to its end in
# milliseconds instead of waiting out every real tick interval.
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "composeUi" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "composeUi" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "composeUi" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview", version.ref = "composeUi" }
androidx-wear-compose-material3 = { group = "androidx.wear.compose", name = "compose-material3", version.ref = "wearCompose" }
androidx-wear-tooling-preview = { group = "androidx.wear", name = "wear-tooling-preview", version.ref = "wearToolingPreview" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4", version.ref = "composeUi" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest", version.ref = "composeUi" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
# androidx.test.ext:junit pulls core/monitor/storage but NOT the runner, and the
# runner is what defaultConfig.testInstrumentationRunner names - without it every
# connectedAndroidTest fails to start.
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
