# detekt configuration. Overrides layer on top of detekt's bundled defaults
# (buildUponDefaultConfig = true in the module build script).

complexity:
  LongMethod:
    # Declarative @Composable UI functions are legitimately long.
    ignoreAnnotated: ['Composable']
  LongParameterList:
    functionThreshold: 7
    constructorThreshold: 7
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    # Two classes trip this. Puzzle answers one small question per rule - what may
    # be built, what a tap would do, whether the board is finished - and the view
    # model has one small function per thing a finger can do. Splitting either
    # would scatter one subject across two files and leave them to agree with each
    # other, which is worse than a long list of short functions that each say what
    # they are.
    thresholdInClasses: 18

naming:
  FunctionNaming:
    # @Composable functions are PascalCase by convention.
    ignoreAnnotated: ['Composable']
  MatchingDeclarationName:
    # A file here is a topic - the board format, the round-screen geometry, the
    # clock - holding the functions that make it up and whatever small type they
    # hand back. This rule fires on exactly those files, and only by an accident of
    # how many types one of them happens to declare: BoardGeometry.kt holds four
    # and is silently fine, while RoundGeometry.kt holds one and is not. Renaming
    # RoundGeometry.kt to Box.kt would name the file after its least interesting
    # part - a rectangle - rather than after the chord maths that is the whole
    # point of it, so the rule is off rather than obeyed.
    #
    # ktlint still enforces the case the rule is actually for - a file whose only
    # content is one class - so Mulberry32.kt cannot drift away from its class.
    active: false

style:
  MagicNumber:
    # The layout is a pile of proportions - how much of the diameter a cell takes,
    # how far down the face the buttons sit, how far past the edge of the board the
    # map may be dragged - and each one is named and explained where it is
    # declared. Hoisting them into constants a second time would add names without
    # adding meaning.
    active: false
  ReturnCount:
    # Guard-clause early returns are how the rules and the solver stay readable.
    # Dealing a board has four ways to end - an empty collection, a board found, a
    # fresh round found one, or nothing left to deal - and folding any of them into
    # the others buys nothing.
    max: 4
  UnusedPrivateMember:
    # A @Preview function is called by Android Studio's preview renderer, never
    # from code, so every one of them looks unused to static analysis. Only
    # @Preview is exempted, not @Composable: a composable nothing calls really is
    # dead and should still be reported.
    ignoreAnnotated: ['Preview']
