name: Instrumented tests

# Runs the on-device tests on Wear OS emulators, on every pull request and on
# demand.
#
# What it is for: whatever a JVM test cannot reach because it needs a real device
# - a composition, a Context, the watch's own resource resolution. Anything that
# is plain Kotlin belongs in the unit tests, which cost seconds rather than the
# minutes an emulator takes to boot.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

# Without this, pushing twice to a pull request leaves two full emulator matrices
# running against each other for many minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connected:
    runs-on: ubuntu-latest
    # An emulator that never finishes booting produces no output at all, and
    # without a limit the job sits there until the six-hour default kills it.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # The screen the game is designed for: a large round watch, which is
          # what the OnePlus Watch 2R it is built against is.
          - name: watch-round
            profile: wearos_large_round
            api-level: 34
            arch: x86_64
          # The oldest platform the app supports. The layout maths is the same on
          # both, but the Compose runtime and the record store are not.
          #
          # x86, not x86_64: Google only ever published a 32-bit Intel image for
          # Wear OS 3 (`system-images;android-30;android-wear;x86`), so asking for
          # x86_64 here fails before the emulator is even created.
          - name: watch-round-min
            profile: wearos_small_round
            api-level: 30
            arch: x86
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      # KVM is what makes an x86 emulator usable on a runner; without it the
      # emulator falls back to software rendering and the job times out.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The Gradle build that runs inside the emulator step has repeatedly failed
      # to resolve the Kotlin plugin from the plugin portal. Resolving the plugin
      # classpath here, in a step that can be retried on its own and whose output
      # the Gradle cache keeps, takes that network hop off the emulator's
      # critical path.
      - name: Warm the Gradle plugin classpath
        run: ./gradlew --quiet help
      - name: Run the instrumented tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: android-wear
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest
      # A connected test that fails on a headless emulator leaves nothing behind
      # to read: the console shows the assertion, the report shows which device
      # and which of the two rows produced it.
      - name: Upload the test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: connected-report-${{ matrix.name }}
          path: wear/build/reports/androidTests/connected/
          if-no-files-found: ignore
